# AGPL-3.0 许可证

[package]
name = "akispace"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "AkiSpace 远程桌面管理平台"
repository = "https://github.com/akispace/akispace"

[lib]
name = "akispace"
path = "modules/lib.rs"

[[bin]]
name = "akispace-gui"
path = "main.rs"

[[bin]]
name = "akispace-agent"
path = "modules/bin/agent.rs"

[[bin]]
name = "akispace-selftest"
path = "modules/bin/selftest.rs"

[features]
gui = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-global-shortcut"]
default = ["gui"]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Services", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_TaskScheduler", "Win32_System_SystemInformation", "Win32_UI_Shell"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "5.0"
base64 = "0.22"
crossbeam-channel = "0.5"

tauri = { version = "2.11.6", optional = true, features = [] }
tauri-plugin-single-instance = { version = "2.2", optional = true }
tauri-plugin-global-shortcut = { version = "2.2", optional = true }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
